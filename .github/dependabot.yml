version: 2
updates:
  # Python dependencies live in backend/pyproject.toml. Grouped so a single PR
  # bumps the dev toolchain (ruff, pytest, …) instead of one PR per package.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
  # npm dependencies for the SvelteKit frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # svelte-check 4.x breaks on TypeScript 7 (TypeError reading
      # useCaseSensitiveFileNames), and a grouped PR that bundles the major with
      # routine bumps blocks all of them. Take TS majors deliberately, once
      # svelte-check supports it; minors and patches still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # GitHub Actions used by the CI / release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
